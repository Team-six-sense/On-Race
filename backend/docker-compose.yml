services:
  main-mysql:
    image: mysql:8.0
    container_name: on-race-main-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MAIN_DB_PASSWORD}
      MYSQL_DATABASE: ${MAIN_DB_NAME}
    ports:
      - '${MAIN_DB_PORT}:3306'
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      # max_connections: MySQL이 허용하는 최대 동시 연결 수
      # 범위: 100~10000 | 기준: 모든 앱 인스턴스의 HikariCP pool 합 + 여유분(모니터링, 관리 연결)
      # 현재: Main(50) + Auth(30) = 80 → 500이면 충분한 여유
      # [AWS 배포 시] RDS 인스턴스 클래스별 자동 계산됨 (t3.medium: ~312, r5.large: ~1365)
      - --max_connections=500
      # innodb_buffer_pool_size: InnoDB 데이터+인덱스 캐시 메모리
      # 범위: 128M~시스템 메모리의 70% | 기준: 테이블 데이터 크기
      # 클수록 디스크 I/O 감소 → 쿼리 성능 향상
      # 로컬 Docker: 512M~2G, 서버: 전체 메모리의 50~70%
      # 현재 Docker 메모리 31GB, MySQL 사용 ~500MB → 2G 할당 가능 (여유 충분)
      - --innodb_buffer_pool_size=2G
    volumes:
      - main-db-data:/var/lib/mysql
    networks:
      - on-race-network

  main-redis:
    image: redis:7-alpine
    container_name: on-race-main-redis
    ports:
      - '${MAIN_REDIS_PORT}:6379'
    volumes:
      - main-redis-data:/data
    networks:
      - on-race-network
    command: redis-server --requirepass ${MAIN_REDIS_PASSWORD} --notify-keyspace-events Ex

  gateway:
    build:
      context: .
      args:
        SERVICE: gateway
    container_name: on-race-gateway
    labels:
      onrace.log.collect: "true"
    env_file: .env
    ports:
      - '${GATEWAY_SERVER_PORT}:${GATEWAY_SERVER_PORT}'
    environment:
      - GATEWAY_REDIS_HOST=main-redis
      - AUTH_SERVICE_URI=http://auth:${AUTH_SERVER_PORT}
      - MAIN_SERVICE_URI=http://main:${MAIN_SERVER_PORT}
      - QUEUE_SERVICE_URI=http://queue:${QUEUE_SERVER_PORT}
    depends_on:
      - main-redis
      - auth
      - main
      - queue
    networks:
      - on-race-network
    restart: always

  auth:
    build:
      context: .
      args:
        SERVICE: auth
    container_name: on-race-auth
    labels:
      onrace.log.collect: "true"
    env_file: .env
    ports:
      - '${AUTH_SERVER_PORT}:${AUTH_SERVER_PORT}'
    environment:
      - AUTH_DB_HOST=main-mysql
      - AUTH_REDIS_HOST=main-redis
      - MAIN_SERVICE_URI=http://main:${MAIN_SERVER_PORT}
    depends_on:
      - main-mysql
      - main-redis
    networks:
      - on-race-network
    restart: always

  main:
    build:
      context: .
      args:
        SERVICE: main
    container_name: on-race-main
    labels:
      onrace.log.collect: "true"
    env_file: .env
    ports:
      - '${MAIN_SERVER_PORT}:${MAIN_SERVER_PORT}'
    environment:
      - MAIN_DB_HOST=main-mysql
      - MAIN_REDIS_HOST=main-redis
      - AUTH_SERVICE_URI=http://auth:${AUTH_SERVER_PORT}
    depends_on:
      - main-mysql
      - main-redis
    networks:
      - on-race-network
    restart: always

  queue:
    build:
      context: .
      args:
        SERVICE: queue
    container_name: on-race-queue
    labels:
      onrace.log.collect: "true"
    env_file: .env
    ports:
      - '${QUEUE_SERVER_PORT}:${QUEUE_SERVER_PORT}'
    environment:
      - QUEUE_REDIS_HOST=main-redis
    depends_on:
      - main-redis
    networks:
      - on-race-network
    restart: always

  prometheus:
    image: prom/prometheus:latest
    container_name: onrace-prometheus
    ports:
      - "${PROMETHEUS_PORT}:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.template.yml:ro
    env_file: .env
    entrypoint: /bin/sh
    command:
      - -c
      - |
        sed -e 's/GATEWAY_SERVER_PORT/'"$$GATEWAY_SERVER_PORT"'/g' \
            -e 's/AUTH_SERVER_PORT/'"$$AUTH_SERVER_PORT"'/g' \
            -e 's/MAIN_SERVER_PORT/'"$$MAIN_SERVER_PORT"'/g' \
            -e 's/QUEUE_SERVER_PORT/'"$$QUEUE_SERVER_PORT"'/g' \
            /etc/prometheus/prometheus.template.yml > /tmp/prometheus.yml && \
        exec /bin/prometheus --config.file=/tmp/prometheus.yml --storage.tsdb.path=/prometheus
    networks:
      - on-race-network
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: onrace-grafana
    ports:
      - "${GRAFANA_PORT}:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
    depends_on:
      - prometheus
      - loki
    restart: unless-stopped

  loki:
    image: grafana/loki:3.0.0
    container_name: onrace-loki
    ports:
      - "${LOKI_PORT}:3100"
    command: -config.file=/etc/loki/local-config.yaml
    restart: unless-stopped

  promtail:
    image: grafana/promtail:3.0.0
    container_name: onrace-promtail
    volumes:
      - ./promtail.yml:/etc/promtail/config.yml
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    restart: unless-stopped

networks:
  on-race-network:
    driver: bridge

volumes:
  main-db-data:
  main-redis-data:
