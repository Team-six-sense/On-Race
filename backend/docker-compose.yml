services:
  main-mysql:
    image: mysql:8.0
    container_name: on-race-main-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MAIN_DB_PASSWORD}
      MYSQL_DATABASE: ${MAIN_DB_NAME}
    ports:
      - '${MAIN_DB_PORT}:3306'
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - main-db-data:/var/lib/mysql
    networks:
      - on-race-network

  main-redis:
    image: redis:7-alpine
    container_name: on-race-main-redis
    ports:
      - '${MAIN_REDIS_PORT}:6379'
    volumes:
      - main-redis-data:/data
    networks:
      - on-race-network
    command: redis-server --requirepass ${MAIN_REDIS_PASSWORD} --notify-keyspace-events Ex

  gateway:
    build:
      context: .
      args:
        SERVICE: gateway
    container_name: on-race-gateway
    labels:
      onrace.log.collect: "true"
    env_file: .env
    ports:
      - '${GATEWAY_SERVER_PORT}:${GATEWAY_SERVER_PORT}'
    environment:
      - GATEWAY_REDIS_HOST=main-redis
      - AUTH_SERVICE_URI=http://auth:${AUTH_SERVER_PORT}
      - MAIN_SERVICE_URI=http://main:${MAIN_SERVER_PORT}
      - QUEUE_SERVICE_URI=http://queue:${QUEUE_SERVER_PORT}
    depends_on:
      - main-redis
      - auth
      - main
      - queue
    networks:
      - on-race-network
    restart: always

  auth:
    build:
      context: .
      args:
        SERVICE: auth
    container_name: on-race-auth
    labels:
      onrace.log.collect: "true"
    env_file: .env
    ports:
      - '${AUTH_SERVER_PORT}:${AUTH_SERVER_PORT}'
    environment:
      - AUTH_DB_HOST=main-mysql
      - AUTH_REDIS_HOST=main-redis
      - MAIN_SERVICE_URI=http://main:${MAIN_SERVER_PORT}
    depends_on:
      - main-mysql
      - main-redis
    networks:
      - on-race-network
    restart: always

  main:
    build:
      context: .
      args:
        SERVICE: main
    container_name: on-race-main
    labels:
      onrace.log.collect: "true"
    env_file: .env
    ports:
      - '${MAIN_SERVER_PORT}:${MAIN_SERVER_PORT}'
    environment:
      - MAIN_DB_HOST=main-mysql
      - MAIN_REDIS_HOST=main-redis
      - AUTH_SERVICE_URI=http://auth:${AUTH_SERVER_PORT}
    depends_on:
      - main-mysql
      - main-redis
    networks:
      - on-race-network
    restart: always

  queue:
    build:
      context: .
      args:
        SERVICE: queue
    container_name: on-race-queue
    labels:
      onrace.log.collect: "true"
    env_file: .env
    ports:
      - '${QUEUE_SERVER_PORT}:${QUEUE_SERVER_PORT}'
    environment:
      - QUEUE_REDIS_HOST=main-redis
    depends_on:
      - main-redis
    networks:
      - on-race-network
    restart: always

  prometheus:
    image: prom/prometheus:latest
    container_name: onrace-prometheus
    ports:
      - "${PROMETHEUS_PORT}:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.template.yml:ro
    env_file: .env
    entrypoint: /bin/sh
    command:
      - -c
      - |
        sed -e 's/GATEWAY_SERVER_PORT/'"$$GATEWAY_SERVER_PORT"'/g' \
            -e 's/AUTH_SERVER_PORT/'"$$AUTH_SERVER_PORT"'/g' \
            -e 's/MAIN_SERVER_PORT/'"$$MAIN_SERVER_PORT"'/g' \
            -e 's/QUEUE_SERVER_PORT/'"$$QUEUE_SERVER_PORT"'/g' \
            /etc/prometheus/prometheus.template.yml > /tmp/prometheus.yml && \
        exec /bin/prometheus --config.file=/tmp/prometheus.yml --storage.tsdb.path=/prometheus
    networks:
      - on-race-network
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: onrace-grafana
    ports:
      - "${GRAFANA_PORT}:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
    depends_on:
      - prometheus
      - loki
    restart: unless-stopped

  loki:
    image: grafana/loki:3.0.0
    container_name: onrace-loki
    ports:
      - "${LOKI_PORT}:3100"
    command: -config.file=/etc/loki/local-config.yaml
    restart: unless-stopped

  promtail:
    image: grafana/promtail:3.0.0
    container_name: onrace-promtail
    volumes:
      - ./promtail.yml:/etc/promtail/config.yml
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    restart: unless-stopped

networks:
  on-race-network:
    driver: bridge

volumes:
  main-db-data:
  main-redis-data:
