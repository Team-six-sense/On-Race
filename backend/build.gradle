plugins {
    id 'org.owasp.dependencycheck' version '9.0.9'
    id 'org.springframework.boot' version '3.5.12' apply(false)
    id 'io.spring.dependency-management' version '1.1.7' apply(false)
}

group = 'com.kt.onrace'
version = '0.0.1-SNAPSHOT'
description = 'backend'

allprojects {
    repositories {
        mavenCentral()
    }
}

subprojects {
    apply {
        plugin 'java'
        plugin 'io.spring.dependency-management'
        plugin 'org.owasp.dependencycheck'  // ← 이거 추가!
    }

    // CVE 패치: Spring Boot BOM 관리 라이브러리 버전 강제 오버라이드
    ext['netty.version'] = '4.1.132.Final'
    ext['h2.version'] = '2.2.220'
    ext['commons-io.version'] = '2.17.0'

    // CVE 패치: Spring Boot BOM 미관리 라이브러리 버전 강제 지정
    dependencyManagement {
        dependencies {
            dependency 'commons-fileupload:commons-fileupload:1.5'
            dependency 'commons-beanutils:commons-beanutils:1.9.4'
            dependency 'org.bitbucket.b_c:jose4j:0.9.6'
        }
    }

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }
    }

    configurations {
        compileOnly {
            extendsFrom annotationProcessor
        }
    }

    dependencies {
        compileOnly 'org.projectlombok:lombok'
        annotationProcessor 'org.projectlombok:lombok'
    }

    tasks.withType(Test).configureEach {
        useJUnitPlatform()
    }

    apply plugin: 'jacoco'

    jacocoTestReport {
        dependsOn test
        reports {
            xml.required = true
            html.required = false
        }
    }

    dependencyCheck {
        format = 'ALL'
        failBuildOnCVSS = 7
        suppressionFile = null
        nvd {
            apiKey = project.findProperty('nvdApiKey') ?: System.getenv('NVD_API_KEY') ?: ''
        }
    }
}