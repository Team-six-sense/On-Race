# 1회용 "이미 존재하는 리소스를 삭제하는 코드 포함"
name: "On-Race-Infra-CD"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  AWS_REGION: ap-northeast-2
  CLUSTER_NAME: t6-on-race-prod-cluster
  AWS_ACCOUNT_ID: 274130523831

on:
  push:
    branches: [ "feat/infra/init-monitoring" ]

jobs:
  terraform:
    runs-on: ubuntu-latest
    
    permissions:
      id-token: write
      contents: read
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-duration-seconds: 14400

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      # [1회성 스텝] 파워쉘에서 [발견]된 리소스만 정밀 타격
      - name: One-time Cleanup of Identified Conflict Resources
        run: |
          echo "검색된 더미 리소스 정밀 삭제 시작..."

          # 1. 발견된 IAM 역할 삭제 (연결된 정책 해제 포함)
          ROLES=(
            "t6-on-race-ai-vqa-pod-role"
            "t6-on-race-ebs-csi-role"
            "t6-on-race-prod-keda-operator-role"
            "t6-on-race-lb-controller"
            "t6-on-race-prod-cluster-loki-irsa"
          )
          for role in "${ROLES[@]}"; do
            echo "더미 역할 제거 중: $role"
            # 관리형 정책 해제
            attached_policies=$(aws iam list-attached-role-policies --role-name $role --query 'AttachedPolicies[].PolicyArn' --output text || true)
            for policy in $attached_policies; do
              if [ "$policy" != "None" ]; then
                aws iam detach-role-policy --role-name $role --policy-arn $policy || true
              fi
            done
            # 인라인 정책 삭제
            inline_policies=$(aws iam list-role-policies --role-name $role --query 'PolicyNames[]' --output text || true)
            for ipolicy in $inline_policies; do
              if [ "$ipolicy" != "None" ]; then
                aws iam delete-role-policy --role-name $role --policy-name $ipolicy || true
              fi
            done
            aws iam delete-role --role-name $role || true
          done

          # 2. 발견된 CloudFront 공개 키 삭제
          KEY_ID=$(aws cloudfront list-public-keys --query "PublicKeyList.Items[?Name=='t6-on-race-vqa-public-key'].Id" --output text)
          if [ "$KEY_ID" != "None" ] && [ -n "$KEY_ID" ]; then
            ETAG=$(aws cloudfront get-public-key --id $KEY_ID --query "ETag" --output text)
            aws cloudfront delete-public-key --id $KEY_ID --if-match $ETAG || true
          fi

          # 3. 발견된 EC2 리소스 삭제
          aws ec2 delete-launch-template --launch-template-name t6-on-race-node-lt || true
          
          # 보안 그룹 ID를 찾아서 삭제 (더 확실한 방법)
          SG_ID=$(aws ec2 describe-security-groups --filters "Name=group-name,Values=t6-on-race-prod-cluster-nodes-common-sg" --query "SecurityGroups[0].GroupId" --output text)
          if [ "$SG_ID" != "None" ] && [ -n "$SG_ID" ]; then
            aws ec2 delete-security-group --group-id $SG_ID || true
          fi

          # 4. 발견된 S3 버킷 삭제
          aws s3 rb s3://t6-on-race-loki-logs-202020842 --force || true

          echo "정밀 청소 완료. 인프라 배포를 시도합니다."

      # 1. Base Layer (IAM, VPC 등) 배포
      - name: Base Layer Apply
        working-directory: ./infra/envs/prod/base
        run: |
          terraform init
          terraform apply -auto-approve

      # 2. EKS Access Entry 조건부 갱신
      - name: Refresh EKS Access Entry
        run: |
          if aws eks describe-cluster --name ${{ env.CLUSTER_NAME }} --region ${{ env.AWS_REGION }} >/dev/null 2>&1; then
            aws eks delete-access-entry --cluster-name ${{ env.CLUSTER_NAME }} --principal-arn ${{ secrets.AWS_ROLE_ARN }} || true
            aws eks create-access-entry --cluster-name ${{ env.CLUSTER_NAME }} --principal-arn ${{ secrets.AWS_ROLE_ARN }} --type STANDARD
            aws eks associate-access-policy --cluster-name ${{ env.CLUSTER_NAME }} --principal-arn ${{ secrets.AWS_ROLE_ARN }} --policy-arn arn:aws:eks::aws:cluster-access-policy/AmazonEKSClusterAdminPolicy --access-scope type=cluster
          fi

      # 3. App Layer 통합 배포
      - name: App Layer - Full Apply
        working-directory: ./infra/envs/prod/app
        run: |
          terraform init
          terraform apply -auto-approve

      # 4. kubectl 인증 정보 생성
      - name: Update Kubeconfig for Kubectl
        run: aws eks update-kubeconfig --region ${{ env.AWS_REGION }} --name ${{ env.CLUSTER_NAME }}

      # 5. CRD 기반 리소스 직접 적용
      - name: Apply K8s Configs via Kubectl
        run: |
          # EC2NodeClass 적용
          cat <<EOF | kubectl apply -f -
          apiVersion: karpenter.k8s.aws/v1
          kind: EC2NodeClass
          metadata:
            name: default
          spec:
            amiFamily: AL2023
            role: t6-on-race-prod-cluster-karpenter-node-role
            subnetSelectorTerms: [{ tags: { "karpenter.sh/discovery": "${{ env.CLUSTER_NAME }}" } }]
            securityGroupSelectorTerms: [{ tags: { "karpenter.sh/discovery": "${{ env.CLUSTER_NAME }}" } }]
            amiSelectorTerms: [{ alias: "al2023@latest" }]
            metadataOptions:
              httpTokens: required
              httpPutResponseHopLimit: 2
              httpEndpoint: enabled
          EOF

          # NodePool 적용
          cat <<EOF | kubectl apply -f -
          apiVersion: karpenter.sh/v1
          kind: NodePool
          metadata:
            name: default
          spec:
            template:
              spec:
                nodeClassRef:
                  group: karpenter.k8s.aws
                  kind: EC2NodeClass
                  name: default
                requirements:
                  - key: karpenter.sh/capacity-type
                    operator: In
                    values: ["spot"]
                  - key: kubernetes.io/arch
                    operator: In
                    values: ["amd64"]
            disruption:
              consolidationPolicy: WhenEmptyOrUnderutilized
              consolidateAfter: 1m
          EOF

          # KEDA ScaledObject 적용
          cat <<EOF | kubectl apply -f -
          apiVersion: keda.sh/v1alpha1
          kind: ScaledObject
          metadata:
            name: on-race-api-scaler
            namespace: t6-on-race-prod
          spec:
            scaleTargetRef:
              name: on-race-api
            minReplicaCount: 2
            maxReplicaCount: 300
            triggers:
              - type: prometheus
                metadata:
                  serverAddress: http://t6-on-race-prometheus-server.monitoring.svc.cluster.local:80
                  metricName: onrace_tps_requests_total
                  threshold: "50"
                  query: "sum(rate(onrace_tps_requests_total{result=\"allowed\"}[1m]))"
          EOF