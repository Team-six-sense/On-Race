name: "On-Race-Infra-CD"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  AWS_REGION: ap-northeast-2
  CLUSTER_NAME: t6-on-race-prod-cluster

on:
  push:
    branches: [ "feat/infra/init-monitoring" ]

jobs:
  terraform:
    runs-on: ubuntu-latest
    
    # OIDC 인증 권한
    permissions:
      id-token: write
      contents: read
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-duration-seconds: 3600

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      # 1. IAM Role 등 기초 인프라 배포
      - name: Base Layer Apply
        working-directory: ./infra/envs/prod/base
        run: |
          terraform init
          terraform apply -auto-approve

      # 2. [중요] App Layer 실행 전, 이미 생성된 클러스터의 인증 정보를 미리 가져옴
      # 테라폼이 Plan 단계에서 K8s API에 접속할 수 있게 해줍니다.
      - name: Update Kubeconfig
        run: |
          aws eks update-kubeconfig --region ${{ env.AWS_REGION }} --name ${{ env.CLUSTER_NAME }} || echo "Cluster not ready yet"

      # 3. [핵심 수정] 쪼개져 있던 -target 스텝들을 하나로 통합하여 전체 배포
      - name: App Layer - Full Apply
        working-directory: ./infra/envs/prod/app
        run: |
          terraform init
          terraform apply -auto-approve

      # 4. KEDA ScaledObject 강제 적용 단계
      - name: Apply KEDA ScaledObject via Kubectl
        run: |
          cat <<EOF | kubectl apply -f -
          apiVersion: keda.sh/v1alpha1
          kind: ScaledObject
          metadata:
            name: on-race-api-scaler
            namespace: t6-on-race-prod
          spec:
            scaleTargetRef:
              name: on-race-api
            minReplicaCount: 2
            maxReplicaCount: 300
            triggers:
              - type: prometheus
                metadata:
                  serverAddress: http://t6-on-race-prometheus-server.monitoring.svc.cluster.local:80
                  metricName: onrace_tps_requests_total
                  threshold: "50"
                  query: "sum(rate(onrace_tps_requests_total{result=\"allowed\"}[1m]))"
          EOF