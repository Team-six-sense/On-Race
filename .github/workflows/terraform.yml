  name: "On-Race-Infra-CD"

  env:
    FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    AWS_REGION: ap-northeast-2
    CLUSTER_NAME: t6-on-race-prod-cluster

  on:
    push:
      branches: [ "feat/infra/init-monitoring" ]

  jobs:
    terraform:
      runs-on: ubuntu-latest
      
      permissions:
        id-token: write
        contents: read
      
      steps:
        - name: Checkout Code
          uses: actions/checkout@v4

        - name: Configure AWS Credentials
          uses: aws-actions/configure-aws-credentials@v4
          with:
            role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
            aws-region: ${{ env.AWS_REGION }}
            role-duration-seconds: 3600

        - name: Setup Terraform
          uses: hashicorp/setup-terraform@v3

        # 1. Base Layer (IAM, VPC 등) 배포
        - name: Base Layer Apply
          working-directory: ./infra/envs/prod/base
          run: |
            terraform init
            terraform apply -auto-approve

        # 2. App Layer (EKS, Helm 차트 등) 통합 배포
        # 테라폼 내부 프로바이더는 exec 블록을 통해 직접 인증하므로 이 단계에서는 kubeconfig가 불필요함
        - name: App Layer - Full Apply
          working-directory: ./infra/envs/prod/app
          run: |
            terraform init
            terraform apply -auto-approve

        # 3. kubectl 인증 정보 생성
        # 테라폼 프로바이더와 달리 외부 명령어인 kubectl은 러너 환경에 인증 파일(~/.kube/config)이 반드시 있어야 함
        - name: Update Kubeconfig for Kubectl
          run: aws eks update-kubeconfig --region ${{ env.AWS_REGION }} --name ${{ env.CLUSTER_NAME }}

        # 4. 테라폼 plan 단계에서 에러를 유발하는 CRD 기반 리소스들을 kubectl로 직접 적용
        - name: Apply K8s Configs via Kubectl
          run: |
            # Karpenter EC2NodeClass 적용
            cat <<EOF | kubectl apply -f -
            apiVersion: karpenter.k8s.aws/v1
            kind: EC2NodeClass
            metadata:
              name: default
            spec:
              amiFamily: AL2023
              role: t6-on-race-prod-cluster-karpenter-node-role
              subnetSelectorTerms: [{ tags: { "karpenter.sh/discovery": "${{ env.CLUSTER_NAME }}" } }]
              securityGroupSelectorTerms: [{ tags: { "karpenter.sh/discovery": "${{ env.CLUSTER_NAME }}" } }]
              amiSelectorTerms: [{ alias: "al2023@latest" }]
              metadataOptions:
                httpTokens: required
                httpPutResponseHopLimit: 2
                httpEndpoint: enabled
            EOF

            # Karpenter NodePool 적용
            cat <<EOF | kubectl apply -f -
            apiVersion: karpenter.sh/v1
            kind: NodePool
            metadata:
              name: default
            spec:
              template:
                spec:
                  nodeClassRef:
                    group: karpenter.k8s.aws
                    kind: EC2NodeClass
                    name: default
                  requirements:
                    - key: karpenter.sh/capacity-type
                      operator: In
                      values: ["spot"]
                    - key: kubernetes.io/arch
                      operator: In
                      values: ["amd64"]
              disruption:
                consolidationPolicy: WhenEmptyOrUnderutilized
                consolidateAfter: 1m
            EOF

            # KEDA ScaledObject 적용
            cat <<EOF | kubectl apply -f -
            apiVersion: keda.sh/v1alpha1
            kind: ScaledObject
            metadata:
              name: on-race-api-scaler
              namespace: t6-on-race-prod
            spec:
              scaleTargetRef:
                name: on-race-api
              minReplicaCount: 2
              maxReplicaCount: 300
              triggers:
                - type: prometheus
                  metadata:
                    serverAddress: http://t6-on-race-prometheus-server.monitoring.svc.cluster.local:80
                    metricName: onrace_tps_requests_total
                    threshold: "50"
                    query: "sum(rate(onrace_tps_requests_total{result=\"allowed\"}[1m]))"
            EOF