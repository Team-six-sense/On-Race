name: "On-Race-Infra-CD"

# [수정] 파일 상단에 환경 변수 추가하여 모든 단계에서 Node.js 24 사용
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  push:
    branches: [ "feat/infra/init-monitoring" ]

jobs:
  terraform:
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./infra/envs/prod

    env:
      CLUSTER_NAME: t6-on-race-prod-cluster
      AWS_REGION: ap-northeast-2

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init

      # [Step 1] 인프라 기저(VPC, EKS) + 데이터(RDS/Redis) 선배포
      # rds_proxy_endpoint 출력 에러를 방지하기 위해 module.data를 포함합니다.
      - name: Step 1 - Core Infrastructure & Data
        run: terraform apply -target=module.vpc -target=module.eks -target=module.data -auto-approve

      # [Step 2] EKS 인증 정보 갱신
      - name: Step 2 - Update Kubeconfig
        run: aws eks update-kubeconfig --region ${{ env.AWS_REGION }} --name ${{ env.CLUSTER_NAME }}

      # [Step 3] KEDA 엔진 및 Karpenter 기초 설치
      - name: Step 3 - KEDA & Karpenter Engine Setup
        run: terraform apply -target=helm_release.keda -target=helm_release.karpenter -auto-approve

      # [Step 4] 나머지 전체 리소스 배포 (KEDA ScaledObject, Karpenter NodePool 등)
      - name: Step 4 - Full Resources Apply
        run: terraform apply -auto-approve