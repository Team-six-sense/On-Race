name: "On-Race-Infra-CD"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  AWS_REGION: ap-northeast-2
  CLUSTER_NAME: t6-on-race-prod-cluster

on:
  push:
    branches: [ "feat/infra/init-monitoring" ]

jobs:
  terraform:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      # --- [1단계] Base 계층 배포 (VPC, Redis, SQS 등) ---
      - name: Base Layer - Init & Apply
        working-directory: ./infra/envs/prod/base
        run: |
          terraform init
          terraform apply -auto-approve

      # --- [2단계] App 계층 초기화 (EKS, Helm) ---
      - name: App Layer - Init
        working-directory: ./infra/envs/prod/app
        run: terraform init

      # --- [3단계] EKS 클러스터 우선 생성 (Targeted Apply) ---
      # 클러스터가 있어야 K8s Manifest 에러가 나지 않습니다.
      - name: App Layer - Create EKS Cluster
        working-directory: ./infra/envs/prod/app
        run: terraform apply -target="module.eks" -auto-approve

      # --- [4단계] Kubeconfig 갱신 ---
      - name: Update Kubeconfig
        run: aws eks update-kubeconfig --region ${{ env.AWS_REGION }} --name ${{ env.CLUSTER_NAME }}

      # --- [5단계] App Layer 전체 배포 (KEDA, Karpenter, Manifests) ---
      - name: App Layer - Full Apply
        working-directory: ./infra/envs/prod/app
        run: terraform apply -auto-approve

      # --- [6단계] Custom K8s 리소스 적용 ---
      - name: Apply Custom K8s Manifests
        working-directory: ./infra/envs/prod/app
        run: |
          # ServiceMonitor CRD 설치
          kubectl apply -f https://raw.githubusercontent.com/prometheus-operator/prometheus-operator/main/example/prometheus-operator-crd/monitoring.coreos.com_servicemonitors.yaml
          
          # SCG 모니터링 설정 적용 (상대 경로 주의)
          kubectl apply -f helm-values/service-monitor-scg.yaml