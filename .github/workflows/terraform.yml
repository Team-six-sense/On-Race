name: "On-Race-Infra-CD" # 요구하신 이름으로 변경

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  AWS_REGION: ap-northeast-2
  CLUSTER_NAME: t6-on-race-prod-cluster

on:
  push:
    branches: [ "feat/infra/init-monitoring" ]

jobs:
  terraform:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      # --- [1단계] Base 계층 배포 ---
      - name: Base Layer - Init & Apply
        working-directory: ./infra/envs/prod/base
        run: |
          terraform init
          terraform apply -auto-approve

      # --- [2단계] App 계층 초기화 ---
      - name: App Layer - Init
        working-directory: ./infra/envs/prod/app
        run: terraform init

      # --- [3단계] 핵심 인프라 및 컨트롤러 우선 설치 ---
      - name: App Layer - Targeted Apply (EKS & Controllers)
        working-directory: ./infra/envs/prod/app
        run: |
          terraform apply -auto-approve \
            -target=module.eks \
            -target=module.lb_controller_irsa \
            -target=helm_release.lb_controller \
            -target=module.karpenter \
            -target=helm_release.karpenter \
            -target=helm_release.keda \
            -target=module.loki \
            -target=helm_release.loki \
            -target=helm_release.prometheus \
            -target=aws_eks_addon.ebs_csi \
            -target=kubernetes_storage_class_v1.gp3_default

      # --- [4단계] Kubeconfig 갱신 ---
      - name: Update Kubeconfig
        run: aws eks update-kubeconfig --region ${{ env.AWS_REGION }} --name ${{ env.CLUSTER_NAME }}

      # --- [5단계] App Layer 전체 배포 (Manifests 등 나머지) ---
      - name: App Layer - Full Apply
        working-directory: ./infra/envs/prod/app
        run: terraform apply -auto-approve