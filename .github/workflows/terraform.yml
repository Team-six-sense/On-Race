name: "On-Race-Infra-CD"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  AWS_REGION: ap-northeast-2
  CLUSTER_NAME: t6-on-race-prod-cluster

on:
  push:
    branches: [ "feat/infra/init-monitoring" ]

jobs:
  terraform:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      # --- [1단계] Base 계층 (VPC, DB, Redis) ---
      - name: Base Layer - Init & Apply
        working-directory: ./infra/envs/prod/base
        run: |
          terraform init
          terraform apply -auto-approve

      # --- [2단계] App 계층 초기화 ---
      - name: App Layer - Init
        working-directory: ./infra/envs/prod/app
        run: terraform init

      # --- [3단계] EKS 클러스터 본체 배포 ---
      - name: App Layer - Create EKS Cluster
        working-directory: ./infra/envs/prod/app
        run: terraform apply -auto-approve -target=module.eks

      # --- [4단계] Kubeconfig 갱신 ---
      - name: Update Kubeconfig
        run: aws eks update-kubeconfig --region ${{ env.AWS_REGION }} --name ${{ env.CLUSTER_NAME }}

      # --- [5단계] ALB 컨트롤러 설치 (Ingress 구동 필수) ---
      - name: App Layer - Targeted Apply (LB Controller)
        working-directory: ./infra/envs/prod/app
        run: |
          terraform apply -auto-approve \
            -target=module.lb_controller_irsa \
            -target=helm_release.lb_controller

      - name: Wait for LB Controller Webhook
        run: sleep 180

      # --- [5-2단계] 필수 애드온 및 오토스케일러 설치 ---
      # Grafana/Prometheus의 PV 생성을 위해 EBS CSI와 StorageClass를 먼저 설치합니다.
      - name: App Layer - Infrastructure Add-ons
        working-directory: ./infra/envs/prod/app
        run: |
          terraform apply -auto-approve \
            -target=aws_eks_addon.ebs_csi \
            -target=kubernetes_storage_class_v1.gp3_default \
            -target=module.karpenter \
            -target=helm_release.karpenter \
            -target=helm_release.keda

      # --- [5-3단계] 모니터링 스택 통합 배포 (의존성 해결) ---
      # Grafana가 의존하는 Loki와 Prometheus를 한 번에 배포하여 그래프 꼬임을 방지합니다.
      - name: App Layer - Monitoring Stack
        working-directory: ./infra/envs/prod/app
        run: |
          terraform apply -auto-approve \
            -target=module.loki \
            -target=helm_release.loki \
            -target=helm_release.prometheus \
            -target=helm_release.grafana

      # --- [6단계] App Layer 전체 배포 (Manifests, Apps 등) ---
      - name: App Layer - Full Apply
        working-directory: ./infra/envs/prod/app
        run: terraform apply -auto-approve