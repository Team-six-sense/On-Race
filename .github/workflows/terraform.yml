name: "On-Race-Infra-CD"

on:
  push:
    branches: [ "feat/infra/init-monitoring" ]

jobs:
  terraform:
    runs-on: ubuntu-latest
    env:
      WORKING_DIR: ./infra/envs/prod
      CLUSTER_NAME: t6-on-race-prod-cluster
      AWS_REGION: ap-northeast-2

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init
        working-directory: ${{ env.WORKING_DIR }}

      # [Step 1] 인프라 기저(VPC, EKS) 선배포
      - name: Step 1 - Core Infrastructure
        run: terraform apply -target=module.vpc -target=module.eks -auto-approve
        working-directory: ${{ env.WORKING_DIR }}

      # [Step 2] EKS 인증 정보 갱신 (쿠버네티스 리소스 배포 준비)
      - name: Step 2 - Update Kubeconfig
        run: aws eks update-kubeconfig --region ${{ env.AWS_REGION }} --name ${{ env.CLUSTER_NAME }}

      # [Step 3] 나머지 전체 리소스 배포 (KEDA, Prometheus, Service 등)
      - name: Step 3 - Full Resources Apply
        run: terraform apply -auto-approve
        working-directory: ${{ env.WORKING_DIR }}