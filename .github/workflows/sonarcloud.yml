name: SonarCloud Security Scan

on:
  push:
    branches:
      - main
      - develop
      - deploy/integrated-main # 신규 통합 브랜치 추가
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  sonarcloud:
    name: SonarCloud Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      # 1. Frontend 빌드 (개발팀 로직 유지)
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        working-directory: ./frontend
        run: pnpm run build

      # 2. Backend 테스트 및 JaCoCo 커버리지 생성 (개발팀 로직 유지)
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Run backend tests with coverage
        working-directory: ./backend
        run: ./gradlew classes :auth:test :auth:jacocoTestReport :main:test :main:jacocoTestReport --no-daemon
        continue-on-error: true

      # 3. SonarCloud 스캔 (인프라/보안팀 설정 적용)
      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=team-six-sense
            -Dsonar.projectKey=team-six-sense_On-Race
      
      # 4. Quality Gate 체크 (인프라/보안팀 설정 적용)
      - name: Check Quality Gate
        uses: SonarSource/sonarqube-quality-gate-action@v1
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}