name: SonarCloud Security Scan

on:
  push:
    branches:
      - deploy/integrated-main
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  sonarcloud:
    name: SonarCloud Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 1. Frontend 빌드 (캐싱 추가)
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'pnpm' # 캐싱 추가
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install pnpm
        uses: pnpm/action-setup@v4 # 최신 v4 권장
        with:
          version: 9

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        working-directory: ./frontend
        run: pnpm run build

      # 2. Backend 테스트 및 JaCoCo 커버리지 (캐싱 및 전체 테스트 추가)
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle' # Gradle 캐싱 추가

      - name: Grant execute permission for gradlew
        working-directory: ./backend
        run: chmod +x gradlew # 실행 권한 보장

      - name: Run all backend tests with coverage
        working-directory: ./backend
        # [중요] 모든 모듈의 테스트와 리포트 생성을 한꺼번에 수행합니다.
        run: ./gradlew test jacocoTestReport --no-daemon
        continue-on-error: true

      # 3. SonarCloud 스캔
      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=team-six-sense
            -Dsonar.projectKey=team-six-sense_On-Race
     
      # 4. Quality Gate 체크
      - name: Check Quality Gate
        uses: SonarSource/sonarqube-quality-gate-action@v1
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}