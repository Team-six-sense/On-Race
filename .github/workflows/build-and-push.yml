name: Build and Push to ECR

on:
  workflow_run:
    workflows: ["SonarCloud Security Scan"]
    types: [completed]
  workflow_dispatch:

env:
  AWS_REGION: ap-northeast-2
  ECR_REPOSITORY: t6-on-race-repo
  # [수정] 태그에 Git 커밋 해시(SHA)를 추가하여 롤백이 가능하도록 합니다.
  IMAGE_TAG: ${{ github.sha }}

permissions:
  id-token: write
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        ref: ${{ github.event.workflow_run.head_branch || github.ref }}

    # [추가] Docker Buildx 설정 (캐싱을 위해 필수)
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    # [핵심 수정] 공식 액션을 사용하여 캐싱과 멀티 태깅 적용
    - name: Build and Push image
      uses: docker/build-push-action@v5
      with:
        context: ./backend
        # [주의] Dockerfile이 backend/Dockerfile에 위치해야 함
        file: ./backend/Dockerfile
        push: true
        build-args: |
          SERVICE=main
        tags: |
          ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
          ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}
        # [추가] GitHub Actions 캐시 기능을 사용하여 빌드 속도 극대화
        cache-from: type=gha
        cache-to: type=gha,mode=max