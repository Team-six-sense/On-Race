name: Build and Push to ECR

on:
  push:
    branches:
      - deploy/integrated-main
  workflow_dispatch:

env:
  AWS_REGION: ap-northeast-2
  ECR_REPOSITORY: t6-on-race-repo
  IMAGE_TAG: ${{ github.sha }}

permissions:
  id-token: write
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    # [핵심 수정] 모든 서비스를 병렬로 빌드하기 위한 매트릭스 설정
    strategy:
      fail-fast: false
      matrix:
        service: [main, auth, gateway, queue]

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Build and Push image
      uses: docker/build-push-action@v5
      with:
        context: ./backend
        file: ./backend/Dockerfile
        push: true
        # [핵심 수정] 빌드 인자로 현재 매트릭스의 서비스명을 전달
        build-args: |
          SERVICE=${{ matrix.service }}
        # [핵심 수정] 서비스별 고유 태그 부여 (예: t6-on-race-repo:main-latest)
        tags: |
          ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ matrix.service }}-latest
          ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ matrix.service }}-${{ env.IMAGE_TAG }}
        # GitHub Actions 전용 캐시를 사용하여 빌드 속도 최적화
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Summary
      run: |
        echo "Successfully built and pushed ${{ matrix.service }} image."
        echo "Tag: ${{ matrix.service }}-${{ env.IMAGE_TAG }}"

