name: "🛡️ On-Race Infrastructure Security Gate"

on:
  push:
    branches: [ "deploy/integrated-main" ]
  pull_request:
    branches: [ "deploy/integrated-main" ]

jobs:
  grype-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Scan ArgoCD & Core Images
        uses: anchore/scan-action@v3
        id: scan
        with:
          # 우리가 패치한 ArgoCD v3.3.6 이미지를 우선 점검합니다.
          image: "quay.io/argoproj/argocd:v3.3.6"
          # 처음에는 결과를 보기 위해 false로 설정하고, 0개가 확인되면 true로 바꾸세요.
          fail-build: false 
          severity-cutoff: critical
          output-format: table

      - name: Upload Security Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: infrastructure-security-report
          path: ${{ steps.scan.outputs.sarif }}