name: "🛡️ On-Race Infrastructure Security Gate"

on:
  push:
    branches: [ "deploy/integrated-main" ]
  pull_request:
    branches: [ "deploy/integrated-main" ]

jobs:
  grype-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Scan ArgoCD & Core Images
        uses: anchore/scan-action@v3
        id: scan
        with:
          image: "quay.io/argoproj/argocd:v3.3.6"
          fail-build: false
          severity-cutoff: critical
          # 파일을 생성하기 위해 sarif 형식으로 변경 (이러면 리포트 업로드가 가능해집니다)
          output-format: sarif

      - name: Upload Security Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: infrastructure-security-report
          # 위 단계에서 생성된 sarif 파일 경로를 참조합니다.
          path: ${{ steps.scan.outputs.sarif }}