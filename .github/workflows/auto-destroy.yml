name: 'Auto Destroy App Layer'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  AWS_REGION: ap-northeast-2

on:
  schedule:
    - cron: '0 15 * * *' # 매일 한국 시간 밤 12시
  workflow_dispatch:

jobs:
  destroy-app-only:
    name: 'Destroy EKS & Apps'
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. 슬랙 알림 (App 삭제 경고)
      - name: Notify Slack (Warning)
        run: |
          curl -X POST -H 'Content-type: application/json' \
          --data '{"text":"🚨 [비용절감] 10분 뒤 EKS 클러스터와 애플리케이션만 자동 삭제됩니다.\nVPC와 데이터(Redis/S3)는 유지됩니다."}' \
          ${{ secrets.SLACK_WEBHOOK_URL }}

      # 2. 10분 대기
      - name: Wait for 10 minutes
        run: sleep 600

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      # 3. [핵심] 오직 App 계층만 삭제
      - name: Terraform Destroy (App Only)
        working-directory: ./infra/envs/prod/app
        run: |
          terraform init
          terraform destroy -auto-approve
        
      # 4. 삭제 완료 알림
      - name: Notify Slack (Success)
        if: success()
        run: |
          curl -X POST -H 'Content-type: application/json' \
          --data '{"text":"🗑️ [완료] EKS 클러스터 삭제 완료! 내일 아침에 다시 만나요."}' \
          ${{ secrets.SLACK_WEBHOOK_URL }}