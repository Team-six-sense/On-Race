# On-Race SonarCloud Configuration

# Project identification
sonar.projectKey=team-six-sense_On-Race
sonar.organization=team-six-sense

# Project metadata
sonar.projectName=On-Race
#sonar.projectVersion=1.0

# Source code directories (monorepo structure)
sonar.sources=frontend/src,backend/src
sonar.tests=frontend/src/__tests__,backend/src/test

# TypeScript / JavaScript settings (Frontend)
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
sonar.typescript.tsconfigPath=frontend/tsconfig.json

# Java settings (Backend)
sonar.java.binaries=backend/build/classes
sonar.java.source=21
sonar.java.libraries=backend/build/libs/**/*.jar

# Exclusions
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/coverage/**,**/.pnpm-store/**

# Coverage exclusions
sonar.coverage.exclusions=**/*.test.ts,**/*.spec.ts,**/*.test.tsx,**/*.spec.tsx,**/*.config.js,**/*.config.ts

# Encoding
sonar.sourceEncoding=UTF-8
