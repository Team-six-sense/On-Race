# 1. 어떤 사양의 노드를 띄울 것인가? (NodePool)
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: default
spec:
  template:
    spec:
      requirements:
        - key: "karpenter.sh/capacity-type"
          operator: In
          values: ["spot", "on-demand"] # 비용 절감을 위해 Spot을 지원하지만, 안정성을 위해 On-Demand도 포함
        - key: "karpenter.k8s.aws/instance-category"
          operator: In
          values: ["c", "m", "r"] # 컴퓨팅, 범용, 메모리 최적화 인스턴스 모두 허용
        - key: "karpenter.k8s.aws/instance-generation"
          operator: Gt
          values: ["2"] # 너무 오래된 인스턴스는 제외
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: default
  # 노드가 할 일이 없으면 30초 후에 자동 삭제 (비용 절감)
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 30s

---

# 2. AWS의 어떤 자원(서브넷, 보안그룹)을 쓸 것인가? (EC2NodeClass)
apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: default
spec:
  amiFamily: AL2023 # 최신 Amazon Linux 2023 사용
  amiSelectorTerms: # v1.0에서 필수인 AMI 선택 조건
    - alias: al2023@latest
  role: "t6-on-race-karpenter-node-role" # 아까 테라폼으로 만든 Role 이름
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: "t6-on-race-prod-cluster" # 우리가 서브넷에 박은 태그
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: "t6-on-race-prod-cluster" # 우리가 보안 그룹에 박은 태그