# 1. 공통 설정 및 스토리지
loki:
  auth_enabled: false
  
  # [수정] 단일 바이너리 모드에서 데이터 복제 계수를 1로 고정하여 충돌 방지
  commonConfig:
    replication_factor: 1

  schemaConfig:
    configs:
      - from: "2024-01-01"
        store: tsdb
        object_store: s3
        schema: v13
        index:
          prefix: loki_index_
          period: 24h

  storage:
    type: s3
    bucketNames:
      chunks: t6-on-race-loki-logs-202020842
      ruler: t6-on-race-loki-logs-202020842
      admin: t6-on-race-loki-logs-202020842
    s3:
      region: ap-northeast-2
      s3ForcePathStyle: true

  # 2. IRSA 및 서비스 어카운트
  serviceAccount:
    create: true
    name: loki
    annotations:
      eks.amazonaws.com/role-arn: "arn:aws:iam::274130523831:role/t6-on-race-prod-cluster-loki-irsa"

# 3. 배포 모드 및 유효성 검사 에러 해결
deploymentMode: SingleBinary

# [수정 핵심] SingleBinary 모드 사용 시 아래 SimpleScalable 구성 요소를 반드시 0으로 설정해야 합니다.
# 차트 기본값이 1로 잡혀 있어 발생하는 "You have more than zero replicas..." 에러 해결용입니다.
read:
  replicas: 0
write:
  replicas: 0
backend:
  replicas: 0

# 4. 실제 사용할 단일 실행 파일 및 자원 할당 (다이어트)
singleBinary:
  replicas: 1
  resources:
    requests:
      cpu: 200m
      memory: 512Mi  # 테스트용 다이어트 설정
    limits:
      memory: 1Gi

# 5. 캐시 설정 (메모리 부족 방지)
resultsCache:
  allocatedMemory: 512
  resources:
    requests:
      memory: 512Mi
    limits:
      memory: 1Gi

chunksCache:
  allocatedMemory: 512
  resources:
    requests:
      memory: 512Mi
    limits:
      memory: 1Gi

# 6. 수집기 설정
promtail:
  enabled: true
  config:
    clients:
      - url: http://loki.loki.svc.cluster.local:3100/loki/api/v1/push