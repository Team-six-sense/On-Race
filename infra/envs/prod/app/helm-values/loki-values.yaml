# infra/envs/prod/app/helm-values/loki-values.yaml

loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  schemaConfig:
    configs:
      - from: "2024-01-01"
        store: tsdb
        object_store: s3
        schema: v13
        index:
          prefix: loki_index_
          period: 24h
  storage:
    type: s3
    bucketNames:
      chunks: "${loki_bucket_name}"
      ruler: "${loki_bucket_name}"
      admin: "${loki_bucket_name}"
    s3:
      region: ap-northeast-2
      s3ForcePathStyle: false

  # [중요] ServiceAccount 설정: IRSA 권한 자동 주입
  serviceAccount:
    create: true
    name: loki
    annotations:
      eks.amazonaws.com/role-arn: "${loki_role_arn}"

deploymentMode: SingleBinary

# Gateway DNS 에러 해결을 위한 설정 추가
gateway:
  enabled: true
  replicas: 1
  verboseLogging: true
  nginxConfig:
    # EKS 내부 DNS(CoreDNS) 주소를 명시적으로 지정하여 host not found 에러 방지
    resolver: 172.20.0.10
    # 만약 위 IP로도 안되면 kube-dns.kube-system.svc.cluster.local 입력

singleBinary:
  replicas: 1
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      memory: 1Gi

# Chunks Cache 메모리 제한 (하향 조정 유지)
chunksCache:
  enabled: true
  allocatedMemory: 512
  resources:
    requests:
      cpu: 100m
      memory: 1Gi
    limits:
      memory: 1Gi

# Results Cache 메모리 제한
resultsCache:
  enabled: true
  allocatedMemory: 512
  resources:
    requests:
      cpu: 100m
      memory: 1Gi
    limits:
      memory: 1Gi