# infra/envs/prod/app/helm-values/loki-values.yaml

loki:
  auth_enabled: false
  commonConfig:
    # [고가용성 핵심] 데이터를 3곳에 복제하여 노드 하나가 죽어도 로그 유실을 방지합니다.
    replication_factor: 3
  
  schemaConfig:
    configs:
      - from: "2024-01-01"
        store: tsdb
        object_store: s3
        schema: v13
        index:
          prefix: loki_index_
          period: 24h

  storage:
    type: s3
    bucketNames:
      chunks: "${loki_bucket_name}"
      ruler: "${loki_bucket_name}"
      admin: "${loki_bucket_name}"
    s3:
      region: ap-northeast-2
      s3ForcePathStyle: false

  # [중요] ServiceAccount 설정: IRSA 권한 자동 주입
  serviceAccount:
    create: true
    name: loki
    annotations:
      eks.amazonaws.com/role-arn: "${loki_role_arn}"

# [핵심 수정] 단일 서버 모드에서 읽기/쓰기 분리 모드로 변경
deploymentMode: SimpleScalable

# 읽기 전용 컴포넌트 (Query Frontend, Querier)
read:
  replicas: 2 # 2 -> 1
  # [수정] IRSA 권한이 부여된 'loki' 서비스 어카운트를 사용하도록 명시합니다.
  serviceAccount:
    create: false
    name: loki
  resources:
    requests:
      cpu: 200m
      memory: 1Gi
    limits:
      memory: 2Gi

# 쓰기 전용 컴포넌트 (Ingester)
write:
  replicas: 3  # 3 -> 2 replication_factor가 3이므로 최소 3개 권장 // 복제 계수 3 유지를 위해 최소 2~3개 필요하나 자원 부족 시 조정
  # [수정] IRSA 권한이 부여된 'loki' 서비스 어카운트를 사용하도록 명시합니다.
  serviceAccount:
    create: false
    name: loki
  resources:
    requests:
      cpu: 200m
      memory: 2Gi
    limits:
      memory: 4Gi

# 백엔드 컴포넌트 (Index Gateway, Compactor, Ruler)
backend:
  replicas: 2 # 2 -> 1
  # [수정] IRSA 권한이 부여된 'loki' 서비스 어카운트를 사용하도록 명시합니다.
  serviceAccount:
    create: false
    name: loki
  resources:
    requests:
      cpu: 100m
      memory: 1Gi
    limits:
      memory: 2Gi

# Gateway (Nginx): 트래픽을 Read/Write 컴포넌트로 분산
gateway:
  enabled: true
  replicas: 2  # 2 -> 1게이트웨이도 이중화하여 고가용성 확보
  extraVolumes:
    - name: nginx-cache
      emptyDir: {}
  extraVolumeMounts:
    - name: nginx-cache
      mountPath: /var/cache/nginx
  verboseLogging: true

# SingleBinary 모드는 사용하지 않으므로 replicas를 0으로 설정하거나 삭제
singleBinary:
  replicas: 0

# 캐시 설정 (HA 환경에서 성능 최적화)
chunksCache:
  enabled: true
  allocatedMemory: 512
resultsCache:
  enabled: true
  allocatedMemory: 512