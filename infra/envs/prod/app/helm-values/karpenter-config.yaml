apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: default
spec:
  template:
    spec:
      requirements:
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]
        # [핵심 수정] Spot을 우선 사용하고, Spot이 없으면 On-demand 사용
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["spot", "on-demand"]
        # C(컴퓨팅), M(범용), R(메모리) 계열 모두 허용
        - key: karpenter.k8s.aws/instance-category
          operator: In
          values: ["c", "m", "r"]
        # [추가 권장] 5세대 이상의 최신/효율적 인스턴스만 사용
        - key: karpenter.k8s.aws/instance-generation
          operator: Gt
          values: ["4"]
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: default
  limits:
    cpu: 200 # 300대 확장 대비 상향 완료
  disruption:
    consolidationPolicy: WhenUnderutilized
    consolidateAfter: 1m
---
apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: default
spec:
  amiFamily: AL2023
  role: "on-race-karpenter-node-role"
  amiSelectorTerms:
    - alias: al2023@latest
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: "t6-on-race-prod-cluster"
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: "t6-on-race-prod-cluster"