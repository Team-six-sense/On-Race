apiVersion: karpenter.sh/v1beta1
kind: NodePool
metadata:
  name: default
spec:
  template:
    spec:
      requirements:
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["on-demand"]
        - key: karpenter.k8s.aws/instance-category
          operator: In
          values: ["c", "m", "r"]
      nodeClassRef:
        name: default
  limits:
    cpu: 100
  disruption:
    consolidationPolicy: WhenUnderutilized
---
apiVersion: karpenter.k8s.aws/v1beta1
kind: EC2NodeClass
metadata:
  name: default
spec:
  amiFamily: AL2
  # [주의] 테라폼 k-main.tf에서 생성한 역할 이름과 100% 일치해야 합니다.
  # 만약 var.project_name이 "on-race"라면 아래 이름이 맞습니다.
  role: "on-race-karpenter-node-role" 
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: "t6-on-race-prod-cluster"
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: "t6-on-race-prod-cluster"